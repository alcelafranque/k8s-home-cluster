apiVersion: apps/v1
kind: Deployment
metadata:
  name: rat-king
  labels:
    app.kubernetes.io/name: rat-king
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rat-king
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rat-king
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rat-king
          image: ghcr.io/lac-coloc/rat-king:0.2.3
          imagePullPolicy: IfNotPresent
          args:
            - serve
            - --host
            - 0.0.0.0
            - --port
            - "8080"
            - --refresh-interval
            - "21600"
          env:
            - name: BK_REFRESH_INTERVAL_SECONDS
              value: "21600"
            - name: BK_OUTPUT_DIR
              value: /data/site
            - name: BK_STATE_DIR
              value: /data
            - name: BK_HTTP_TIMEOUT_SECONDS
              value: "30"
            - name: BK_CACHE_MAX_RESTAURANTS
              value: "20"
            - name: BK_REFRESH_QUEUE_MAX
              value: "10"
            - name: BK_COLD_LOADS_PER_HOUR
              value: "6"
            - name: BK_SEARCH_MAX_RESULTS
              value: "20"
            - name: PORT
              value: "8080"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: rat-king-data
