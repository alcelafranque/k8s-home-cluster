apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: pvc-backups
  namespace: actual
spec:
  repository:
    kind: ClusterRepository
    name: dorado
  sources:
    - pvc:
        name: actual-data
  copyMethod: Snapshot
  volumeSnapshotClassName: csi-rbdplugin-snapclass
  retention:
    keepLatest: 36
    keepDaily: 30
    keepWeekly: 8
  credentialProjection:
    enabled: true
---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotSchedule
metadata:
  name: pvc-backups-every-2h
  namespace: actual
spec:
  policyRef:
    name: pvc-backups
  schedule:
    cron: "0 */2 * * *"
    runOnCreate: false
    concurrencyPolicy: Forbid
---
