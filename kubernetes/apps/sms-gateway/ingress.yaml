---
# Only the authenticated /v1 API is exposed: /healthz, /readyz, /docs,
# /openapi.json and the metrics listener stay in-cluster.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sms-gateway
  namespace: sms-gateway
spec:
  parentRefs:
  - name: one-gateway-for-all
    namespace: envoy-gateway-system
    sectionName: https
  hostnames:
  - sms.lac-coloc.fr
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /v1
    backendRefs:
    - name: sms-gateway
      port: 80
---
# HTTP -> HTTPS (301)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sms-gateway-http-redirect
  namespace: sms-gateway
spec:
  parentRefs:
  - name: one-gateway-for-all
    namespace: envoy-gateway-system
    sectionName: http
  hostnames:
  - sms.lac-coloc.fr
  rules:
  - filters:
    - type: RequestRedirect
      requestRedirect:
        scheme: https
        statusCode: 301
