---
# Exposed: the authenticated /v1 API, plus its documentation (Swagger UI at
# /docs, OpenAPI document at /openapi.json; trying requests from the UI still
# needs an API key). /healthz, /readyz and the metrics listener stay
# in-cluster.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sms-gateway
  namespace: sms-gateway
spec:
  parentRefs:
  - name: one-gateway-for-all
    namespace: envoy-gateway-system
    sectionName: https
  hostnames:
  - sms.lac-coloc.fr
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /v1
    - path:
        type: PathPrefix
        value: /docs
    - path:
        type: Exact
        value: /openapi.json
    backendRefs:
    - name: sms-gateway
      port: 80
---
# HTTP -> HTTPS (301)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sms-gateway-http-redirect
  namespace: sms-gateway
spec:
  parentRefs:
  - name: one-gateway-for-all
    namespace: envoy-gateway-system
    sectionName: http
  hostnames:
  - sms.lac-coloc.fr
  rules:
  - filters:
    - type: RequestRedirect
      requestRedirect:
        scheme: https
        statusCode: 301
