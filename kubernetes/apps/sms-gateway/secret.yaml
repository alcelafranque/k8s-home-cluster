apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sms-gateway
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: sms-gateway
    creationPolicy: Owner
    template:
      mergePolicy: Merge
      data:
        # sslmode=require: TLS without certificate verification (sqlx/rustls).
        SMS_GATEWAY__DATABASE__URL: "postgres://sms-gateway-db:{{ .db_password | urlquery }}@cluster-1-rw.cnpg-system.svc.cluster.local:5432/sms_gateway?sslmode=require"
  data:
    - secretKey: db_password
      remoteRef:
        key: k8s/dorado/applications/sms-gateway-db
        property: password
  dataFrom:
    # SMS_GATEWAY__MODEM__TPLINK__PASSWORD (NE200 web UI password).
    # Read at startup only: restart the pod after a rotation.
    - extract:
        key: k8s/dorado/applications/sms-gateway
