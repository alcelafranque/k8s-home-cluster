operatorNamespace: rook-ceph
clusterName: rook-ceph

# Ceph version is pinned on purpose: it must not follow the chart default
# and is upgraded by hand.
cephImage:
  repository: quay.io/ceph/ceph
  tag: v19.2.6

# The chart otherwise renders modules: null; an empty list has the same intent
# and passes the repository's CRD schema validation.
cephClusterSpec:
  mgr:
    modules: []
  security:
    cephx:
      # Daemons use userspace librados/librbd: aes256k is supported.
      daemon:
        keyRotationPolicy: KeyGeneration
        keyGeneration: 1
        keyType: aes256k
      # CSI keys are handed to the kernel (krbd), which rejects aes256k
      # ("failed to add secret to kernel"). Keep aes until kernel support exists.
      # Generation 1 was an aes256k attempt; generation 2 rolls back to aes.
      # keyGeneration must only ever increase.
      csi:
        keyRotationPolicy: KeyGeneration
        keyGeneration: 2
        keyType: aes
        keepPriorKeyCountMax: 1

# RBD only. Omitting these lists would enable the chart's default CephFS and RGW.
cephFileSystems: []
cephObjectStores: []

# Keep the chart's existing cluster and block pool defaults.
# Review their rendered diff on upgrades.
