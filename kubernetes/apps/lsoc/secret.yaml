apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: lsoc
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: lsoc
    creationPolicy: Owner
    template:
      mergePolicy: Merge
      data:
        LSOC_DATABASE_URL: "postgresql+psycopg://lsoc:{{ .db_password | urlquery }}@cluster-1-rw.cnpg-system.svc.cluster.local:5432/lsoc?sslmode=require"
  data:
    - secretKey: db_password
      remoteRef:
        key: k8s/dorado/applications/lsoc-db
        property: password
  dataFrom:
    # LSOC_SECRET_KEY, LSOC_SMTP_HOST, LSOC_SMTP_PORT, LSOC_SMTP_USERNAME,
    # LSOC_SMTP_PASSWORD, LSOC_SMTP_FROM, LSOC_SMTP_STARTTLS or LSOC_SMTP_SSL,
    # LSOC_S3_ACCESS_KEY, LSOC_S3_SECRET_KEY
    - extract:
        key: k8s/dorado/applications/lsoc
