apiVersion: apps/v1
kind: Deployment
metadata:
  name: lsoc-frontend
  labels:
    app.kubernetes.io/name: lsoc-frontend
    app.kubernetes.io/part-of: lsoc
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: lsoc-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lsoc-frontend
        app.kubernetes.io/part-of: lsoc
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # nginx-unprivileged image user
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: ghcr.io/littleengineertt/lsoc-frontend
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            # pid file and client body / proxy temp directories
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: lsoc-frontend
  labels:
    app.kubernetes.io/name: lsoc-frontend
spec:
  selector:
    app.kubernetes.io/name: lsoc-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
