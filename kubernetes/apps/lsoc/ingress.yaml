---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: lsoc
  namespace: lsoc
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/icon: https://lsoc.lac-coloc.fr/lsoc_logo.png
    gethomepage.dev/name: LSOC
    gethomepage.dev/group: Tools
    gethomepage.dev/description: "LSO Colombes Volley management"
spec:
  parentRefs:
  - name: one-gateway-for-all
    namespace: envoy-gateway-system
    sectionName: https
  hostnames:
  - lsoc.lac-coloc.fr
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /api
    backendRefs:
    - name: lsoc-api
      port: 8000
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: lsoc-frontend
      port: 80
---
# HTTPRoute pour HTTP (redirection 301)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: lsoc-http-redirect
  namespace: lsoc
spec:
  parentRefs:
  - name: one-gateway-for-all
    namespace: envoy-gateway-system
    sectionName: http
  hostnames:
  - lsoc.lac-coloc.fr
  rules:
  - filters:
    - type: RequestRedirect
      requestRedirect:
        scheme: https
        statusCode: 301
