---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

helmCharts:
  - name: gateway-helm
    repo: oci://docker.io/envoyproxy
    version: v1.9.1
    releaseName: eg
    namespace: envoy-gateway-system
    includeCRDs: true

resources:
  - gateway-class.yaml
  - one-gateway-for-all.yaml
  - ipv6-listener-patch.yaml
  - manual/st1-age.yaml
