---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

configMapGenerator:
  - name: geoip-updater
    namespace: envoy-gateway-system
    files:
      - update-geoip.py
generatorOptions:
  # Referenced by EnvoyProxy, outside Kustomize's built-in name references.
  disableNameSuffixHash: true

helmCharts:
  - name: gateway-helm
    repo: oci://docker.io/envoyproxy
    version: v1.9.1
    releaseName: eg
    namespace: envoy-gateway-system
    # Gateway API CRDs are managed by the cluster's standard channel.
    # Do not render Envoy Gateway's bundled experimental CRDs here.
    includeCRDs: false
    valuesInline:
      crds:
        enabled: false

resources:
  - gateway-class.yaml
  - one-gateway-for-all.yaml
  - client-traffic-policy.yaml
  - security-policy.yaml
  - ipv6-listener-patch.yaml
  - manual/st1-age.yaml
