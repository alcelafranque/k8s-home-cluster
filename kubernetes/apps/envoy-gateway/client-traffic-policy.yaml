apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: proxy-protocol
  namespace: envoy-gateway-system
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: one-gateway-for-all
  proxyProtocol:
    # Every client connection is forwarded by HAProxy with PROXY protocol.
    optional: false
  clientIPDetection:
    # PROXY protocol restores remoteAddress before HTTP/GeoIP processing.
    # Never trust an X-Forwarded-For header supplied by an Internet client.
    directSourceIP: {}
  headers:
    earlyRequestHeaders:
      remove:
        - X-Forwarded-For
        # An unknown IP must not inherit a client-supplied GeoIP result.
        - x-eg-internal-geoip-country
    # Applied to every response served through this Gateway. No CSP here on
    # purpose: each application sets its own, a global one would break UIs.
    lateResponseHeaders:
      set:
        - name: Strict-Transport-Security
          value: "max-age=31536000; includeSubDomains"
        - name: X-Content-Type-Options
          value: "nosniff"
        - name: X-Frame-Options
          value: "SAMEORIGIN"
        - name: Referrer-Policy
          value: "no-referrer"
