apiVersion: apps/v1
kind: Deployment
metadata:
  name: wol-manager
  labels:
    app.kubernetes.io/name: wol-manager
spec:
  replicas: 1
  strategy:
    # One Telegram poller at a time, and the volume is ReadWriteOnce.
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: wol-manager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wol-manager
    spec:
      automountServiceAccountToken: false
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: wol-manager
          image: ghcr.io/alcelafranque/wol_manager:latest@sha256:48f8b65c435730e9cbd3e8d8ead32cfd0b8cc102b85f96d7ef8673b6e0ebce2e
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: wol-manager
          env:
            - name: DATABASE_PATH
              value: /data/devices.db
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 128Mi
          securityContext:
            # ping relies on its CAP_NET_RAW file capability, which needs
            # NET_RAW in the bounding set and privilege escalation allowed.
            allowPrivilegeEscalation: true
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
              add:
                - NET_RAW
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: wol-manager-data
