apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: librenms

resources:
  - ingress.yaml
  - secrets.yaml

helmCharts:
  - name: librenms
    repo: https://www.librenms.org/helm-charts
    version: 10.1.1
    releaseName: librenms
    namespace: librenms
    valuesFile: values.yaml

# Chart 10 changed immutable workload selectors. Keep the installed identities
# and matching Service selectors so the existing resources can be upgraded.
patches:
  - path: legacy-selectors.yaml
