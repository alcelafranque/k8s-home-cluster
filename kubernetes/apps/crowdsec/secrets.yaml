apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: crowdsec-db-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: crowdsec-db-secret
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: k8s/dorado/applications/crowdsec-db
