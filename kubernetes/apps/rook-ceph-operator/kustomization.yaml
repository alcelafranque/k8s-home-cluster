apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

helmCharts:
  - name: rook-ceph
    repo: https://charts.rook.io/release
    version: v1.20.7
    releaseName: rook-ceph
    namespace: rook-ceph
    includeCRDs: true
    valuesFile: values.yaml

# Protect top-level objects without changing pod templates and causing rollouts.
transformers:
  - |-
    apiVersion: builtin
    kind: AnnotationsTransformer
    metadata:
      name: protect-rook-resources
    annotations:
      argocd.argoproj.io/sync-options: Prune=false,Delete=false
    fieldSpecs:
      - path: metadata/annotations
        create: true
