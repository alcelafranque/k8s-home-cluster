apiVersion: apps/v1
kind: Deployment
metadata:
  name: calibre
  labels:
    app.kubernetes.io/name: calibre
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    # The Calibre library is file-based: only one pod may write to it.
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: calibre
  template:
    metadata:
      labels:
        app.kubernetes.io/name: calibre
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: calibre
          image: crocodilestick/calibre-web-automated:v4.0.8
          imagePullPolicy: IfNotPresent
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: Europe/Paris
            # The ingest folder is on NFS: inotify does not see writes made by
            # another node, so Calibre-Web has to poll it instead.
            - name: CWA_WATCH_MODE
              value: poll
          ports:
            - name: http
              containerPort: 8083
              protocol: TCP
          startupProbe:
            httpGet:
              path: /login
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /login
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /login
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 2Gi
          securityContext:
            # The s6 init from the base image starts as root to fix ownership
            # on the volumes, so runAsNonRoot and dropping every capability
            # are not possible here.
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: config
              mountPath: /config
            - name: library
              mountPath: /calibre-library
            - name: ingest
              mountPath: /cwa-book-ingest
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: calibre-config
        - name: library
          persistentVolumeClaim:
            claimName: calibre-library
        - name: ingest
          persistentVolumeClaim:
            claimName: calibre-ingest
